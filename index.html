    /* ============================================================
       CSS VARIABLES
    ============================================================ */
    :root {
      --bg-overlay:    rgba(0, 0, 0, 0.45);
      --accent:        #f5c518;
      --accent-cat:    #4a9eff;
      --tab-bg:        rgba(30, 30, 30, 0.82);
      --tab-active-bg: #222;
      --tab-border:    3px solid var(--accent);
      --cat-border:    3px solid var(--accent-cat);
      --btn-bg:        rgba(30, 30, 30, 0.88);
      --btn-border:    3px solid #ccc;
      --text-title:    #ffffff;
      --text-body:     rgba(255,255,255,0.85);
      --text-nav:      #ffffff;
      --font-title:    'Bebas Neue', sans-serif;
      --font-body:     'Barlow', sans-serif;
      --tab-width:     200px;
      --tab-pop:       60px;
      --transition:    0.35s cubic-bezier(.4,0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font-body); color: var(--text-body); }

    /* ============================================================
       VIDEO BACKGROUND
    ============================================================ */
    #bg-container { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #111; }
    #bg-container::after {
      content: ''; position: absolute; inset: 0;
      background: var(--bg-overlay); pointer-events: none; z-index: 1;
    }
    #yt-player {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 177.78vh; height: 56.25vw;
      min-width: 100%; min-height: 100%;
      pointer-events: none;
    }

    /* ============================================================
       LAYOUT SHELL
    ============================================================ */
    #app { position: relative; z-index: 2; width: 100%; height: 100vh; display: flex; flex-direction: column; }

    /* ============================================================
       TOP NAV
    ============================================================ */
    #top-nav {
      width: 100%; display: flex; justify-content: space-evenly;
      align-items: flex-start; padding: 0 2vw; flex-shrink: 0;
    }
    .nav-tab {
      position: relative;
      background: rgba(30, 30, 30, 0.75);
      color: var(--text-nav);
      font-family: var(--font-body);
      font-size: clamp(0.85rem, 1.4vw, 1.1rem);
      font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 10px 28px 12px;
      cursor: pointer; border: none; outline: none; text-decoration: none;
      clip-path: polygon(0 0, 100% 0, 92% 100%, 8% 100%);
      transition: background var(--transition), color var(--transition);
      white-space: nowrap;
    }
    .nav-tab::after {
      content: ''; position: absolute; bottom: 0; left: 8%; right: 8%;
      height: 2px; background: var(--accent);
      transform: scaleX(0); transform-origin: center;
      transition: transform var(--transition);
    }
    .nav-tab:hover { background: rgba(60, 60, 60, 0.92); color: var(--accent); }
    .nav-tab:hover::after { transform: scaleX(1); }

    /* ============================================================
       MAIN AREA
    ============================================================ */
    #main { flex: 1; display: flex; align-items: stretch; overflow: hidden; }

    #content {
      flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
      padding: clamp(20px, 4vw, 60px) clamp(20px, 5vw, 80px);
      padding-right: calc(var(--tab-width) + 20px);
    }

    #title {
      font-family: var(--font-title);
      font-size: clamp(2.5rem, 8vw, 7rem);
      color: var(--text-title); line-height: 0.95; letter-spacing: 0.02em;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.5), 6px 6px 0 rgba(0,0,0,0.2);
      transition: opacity 0.4s ease, transform 0.4s ease;
      margin-bottom: clamp(10px, 2vh, 20px);
    }
    #description {
      font-size: clamp(0.8rem, 1.3vw, 1rem); font-weight: 300; line-height: 1.65;
      max-width: 420px; color: var(--text-body);
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      transition: opacity 0.4s ease;
      margin-bottom: clamp(16px, 3vh, 32px);
    }

    /* ---- BOTTOM ROW: buttons + optional award ---- */
    #bottom-row {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      transition: opacity 0.4s ease;
    }

    /* CTA BUTTONS */
    #cta-buttons {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    .cta-btn {
      display: inline-block;
      background: var(--btn-bg); color: #fff;
      font-family: var(--font-title);
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      letter-spacing: 0.08em; padding: 12px 36px;
      border: var(--btn-border);
      cursor: pointer; text-decoration: none;
      transition: background var(--transition), border-color var(--transition),
                  color var(--transition), transform 0.15s ease;
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
    }
    .cta-btn:hover {
      background: rgba(245, 197, 24, 0.2);
      border-color: var(--accent); color: var(--accent);
      transform: translateX(4px);
    }

    /* ---- AWARD IMAGE ---- */
    #award-wrap {
      display: flex;
      align-items: center;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.4s ease 0.1s, transform 0.4s ease 0.1s;
      pointer-events: none;
    }
    #award-wrap.visible {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    #award-img {
      height: clamp(52px, 7vh, 90px);   /* scale with viewport height */
      width: auto;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7));
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    #award-img:hover {
      transform: scale(1.08) rotate(-2deg);
      filter: drop-shadow(0 4px 14px rgba(245,197,24,0.5));
    }
    /* tooltip on hover (uses title attribute, but we also style a pseudo) */
    #award-wrap[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      background: rgba(20,20,20,0.92);
      color: var(--accent);
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 5px 10px;
      white-space: nowrap;
      pointer-events: none;
    }
    #award-wrap { position: relative; }

    /* ============================================================
       RIGHT TABS — shared base
    ============================================================ */
    #mod-tabs {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: flex-end;
      gap: 8px; padding: 10px 0;
    }

    .mod-tab {
      width: calc(var(--tab-width) + var(--tab-pop));
      transform: translateX(var(--tab-pop));
      transition: transform var(--transition);
      cursor: pointer;
    }
    .mod-tab:hover,
    .mod-tab.active,
    .mod-tab.cat-open {
      transform: translateX(0);
    }
    .mod-tab-inner {
      background: var(--tab-bg); color: #fff;
      font-family: var(--font-body);
      font-size: clamp(0.8rem, 1.2vw, 0.95rem);
      font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 12px 20px 12px 28px;
      border-left: var(--tab-border);
      clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%);
      transition: background var(--transition), color var(--transition);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .mod-tab:not(.cat-tab):hover .mod-tab-inner,
    .mod-tab:not(.cat-tab).active .mod-tab-inner {
      background: var(--tab-active-bg); color: var(--accent);
    }
    .mod-tab:not(.cat-tab).active .mod-tab-inner::before {
      content: '▶ '; color: var(--accent);
    }

    /* ---- CATEGORY HEADER TAB — blue ---- */
    .cat-tab .mod-tab-inner { border-left: var(--cat-border); }
    .cat-tab:hover .mod-tab-inner,
    .cat-tab.cat-open .mod-tab-inner {
      background: var(--tab-active-bg); color: var(--accent-cat);
    }
    .cat-tab .mod-tab-inner::before { content: '▶ '; color: var(--accent-cat); }
    .cat-tab.cat-open .mod-tab-inner::before { content: '▼ '; color: var(--accent-cat); }

    /* ---- CATEGORY WRAPPER + CHILDREN ---- */
    .cat-wrapper {
      width: calc(var(--tab-width) + var(--tab-pop));
      display: flex; flex-direction: column; align-items: flex-end;
    }
    .cat-children {
      width: 100%;
      max-height: 0; overflow: hidden;
      transition: max-height 0.4s cubic-bezier(.4,0,.2,1),
                  padding-top 0.4s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column; gap: 6px;
    }
    .cat-children.open { max-height: 800px; padding-top: 4px; }

    .child-mod-tab .mod-tab-inner {
      padding-left: 36px;
      font-size: clamp(0.72rem, 1.05vw, 0.85rem);
    }

    /* ============================================================
       FADE TRANSITION
    ============================================================ */
    .fade-out { opacity: 0 !important; transform: translateY(8px) !important; }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 700px) {
      :root { --tab-width: 150px; --tab-pop: 40px; }
      #content { padding-right: calc(var(--tab-width) + 10px); }
      .nav-tab { padding: 8px 14px 10px; font-size: 0.75rem; }
      #cta-buttons { gap: 8px; }
      #award-img { height: clamp(40px, 6vh, 60px); }
    }
  </style>
</head>

        description: "Safety Steve from Hall of the Machine King, now in bonelab\nObsolete now, but lives on in the funcitonal alt in UrikaTractor's mod\n\nWhat are you? Some kind of machine king?",
      },
      {
        label:       "Morgan Avatar",
        videoId:     "5G4pvtHlrdw",
        title:       "Morgan Avatar",
        description: 'Adds me, yes me, as an avatar in bonelab\nCreated for my high school senior project\n\n"Follow me Morgan, we need to get to Morgan."',
      },
    ]
  },
];

const CONFIG = {
  defaultMod: "PT Multiplayer Mod",
  siteTitle:  "The King of Slurpzon",
};
</script>
<!-- ============================================================
     END OF CONFIGURATION
============================================================ -->

<!-- VIDEO BACKGROUND -->
<div id="bg-container">
  <iframe id="yt-player" frameborder="0"
    allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<!-- APP -->
<div id="app">
  <nav id="top-nav"></nav>
  <div id="main" style="position:relative;">
    <div id="content">
      <h1 id="title"></h1>
      <p  id="description"></p>
      <div id="bottom-row">
        <div id="cta-buttons"></div>
        <div id="award-wrap">
          <!-- award image injected here by JS -->
        </div>
      </div>
    </div>
    <div id="mod-tabs"></div>
  </div>
</div>

<script>
/* ============================================================
   STATE
============================================================ */
let currentMod      = null;
let openCatChildren = null;
let openCatTab      = null;

/* ============================================================
   HELPERS
============================================================ */
function buildYTSrc(id) {
  return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&controls=0&disablekb=1&playsinline=1&rel=0&playlist=${id}&enablejsapi=1`;
}

function renderButtons(mod) {
  const container = document.getElementById('cta-buttons');
  container.innerHTML = '';
  (mod.buttons || []).forEach(btn => {
    const a = document.createElement('a');
    a.className   = 'cta-btn';
    a.textContent = btn.label;
    a.href        = btn.url;
    a.target      = '_blank';
    a.rel         = 'noopener';
    container.appendChild(a);
  });
}

function renderAward(mod) {
  const wrap = document.getElementById('award-wrap');
  wrap.innerHTML = '';
  wrap.removeAttribute('data-tip');
  wrap.classList.remove('visible');

  if (!mod.award) return;

  const a = mod.award;
  const img = document.createElement('img');
  img.id  = 'award-img';
  img.src = a.src;
  img.alt = a.tip || 'Award';

  if (a.tip)  wrap.setAttribute('data-tip', a.tip);

  if (a.url) {
    const link = document.createElement('a');
    link.href   = a.url;
    link.target = '_blank';
    link.rel    = 'noopener';
    link.appendChild(img);
    wrap.appendChild(link);
  } else {
    wrap.appendChild(img);
  }

  // tiny delay so the CSS transition fires after the element is in the DOM
  requestAnimationFrame(() => wrap.classList.add('visible'));
}

/* ============================================================
   SELECT MOD
============================================================ */
function selectMod(mod, tabEl) {
  const titleEl  = document.getElementById('title');
  const descEl   = document.getElementById('description');
  const btnsEl   = document.getElementById('cta-buttons');
  const bottomEl = document.getElementById('bottom-row');

  titleEl.classList.add('fade-out');
  descEl.classList.add('fade-out');
  bottomEl.classList.add('fade-out');

  document.querySelectorAll('.mod-tab:not(.cat-tab)').forEach(t => t.classList.remove('active'));
  if (tabEl) tabEl.classList.add('active');

  setTimeout(() => {
    titleEl.textContent  = mod.title;
    descEl.innerHTML     = mod.description ? mod.description.replace(/\n/g, '<br>') : '';
    renderButtons(mod);
    renderAward(mod);
    document.getElementById('yt-player').src = buildYTSrc(mod.videoId);
    currentMod = mod;

    titleEl.classList.remove('fade-out');
    descEl.classList.remove('fade-out');
    bottomEl.classList.remove('fade-out');
  }, 350);
}

/* ============================================================
   CATEGORY OPEN / CLOSE
============================================================ */
function closeOpenCategory() {
  if (openCatChildren) {
    openCatChildren.classList.remove('open');
    openCatTab.classList.remove('cat-open');
    openCatChildren = null;
    openCatTab      = null;
  }
}

function openCategory(catEntry, childrenEl, catTabEl) {
  if (openCatChildren && openCatChildren !== childrenEl) closeOpenCategory();
  childrenEl.classList.add('open');
  catTabEl.classList.add('cat-open');
  openCatChildren = childrenEl;
  openCatTab      = catTabEl;
  const firstChildTab = childrenEl.querySelector('.child-mod-tab');
  selectMod(catEntry.mods[0], firstChildTab);
}

/* ============================================================
   BUILD TOP NAV
============================================================ */
const topNavEl = document.getElementById('top-nav');
NAV_TABS.forEach(t => {
  const a = document.createElement('a');
  a.className   = 'nav-tab';
  a.textContent = t.label;
  a.href        = t.href || '#';
  if (t.href && t.href !== '#') a.target = '_blank';
  topNavEl.appendChild(a);
});

/* ============================================================
   BUILD RIGHT TABS + REGISTRY
============================================================ */
const registry      = {};
const tabsContainer = document.getElementById('mod-tabs');

RIGHT_TABS.forEach(entry => {
  if (entry.type === 'mod') {
    const tab = document.createElement('div');
    tab.className = 'mod-tab';
    tab.innerHTML = `<div class="mod-tab-inner">${entry.label}</div>`;
    tab.addEventListener('click', () => {
      closeOpenCategory();
      selectMod(entry, tab);
    });
    tabsContainer.appendChild(tab);
    registry[entry.label] = { mod: entry, tabEl: tab, type: 'standalone' };

  } else if (entry.type === 'category') {
    const wrapper  = document.createElement('div');
    wrapper.className = 'cat-wrapper';

    const catTab   = document.createElement('div');
    catTab.className = 'mod-tab cat-tab';
    catTab.innerHTML = `<div class="mod-tab-inner">${entry.label}</div>`;

    const children = document.createElement('div');
    children.className = 'cat-children';

    entry.mods.forEach(mod => {
      const childTab = document.createElement('div');
      childTab.className = 'mod-tab child-mod-tab';
      childTab.innerHTML = `<div class="mod-tab-inner">${mod.label}</div>`;
      childTab.addEventListener('click', () => selectMod(mod, childTab));
      children.appendChild(childTab);
      registry[mod.label] = { mod, tabEl: childTab, type: 'category', childrenEl: children, catTabEl: catTab };
    });

    catTab.addEventListener('click', () => {
      if (children.classList.contains('open')) {
        closeOpenCategory();
      } else {
        openCategory(entry, children, catTab);
      }
    });

    wrapper.appendChild(catTab);
    wrapper.appendChild(children);
    tabsContainer.appendChild(wrapper);
  }
});

/* ============================================================
   INITIAL RENDER
============================================================ */
(function init() {
  document.title = CONFIG.siteTitle;
  const target = registry[CONFIG.defaultMod];
  if (!target) {
    console.warn(`[Config] defaultMod "${CONFIG.defaultMod}" not found — check label spelling.`);
    return;
  }
  if (target.type === 'category') {
    target.childrenEl.classList.add('open');
    target.catTabEl.classList.add('cat-open');
    openCatChildren = target.childrenEl;
    openCatTab      = target.catTabEl;
  }
  target.tabEl.classList.add('active');
  const mod = target.mod;
  document.getElementById('title').textContent     = mod.title;
  document.getElementById('description').innerHTML = mod.description ? mod.description.replace(/\n/g, '<br>') : '';
  renderButtons(mod);
  renderAward(mod);
  document.getElementById('yt-player').src = buildYTSrc(mod.videoId);
  currentMod = mod;
})();
</script>
</body>
</html>
